# Corre la suite completa en cada push y en cada pull request.

name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Node se necesita para la paridad JS ↔ Python y para probar el correo HTML
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar que los archivos generados coinciden con el código fuente
        run: |
          python scripts/generar_datos.py
          python scripts/build_workflow.py
          git diff --exit-code data/ workflows/*.json \
            || (echo "::error::Los archivos generados no coinciden. Corre generar_datos.py y build_workflow.py" && exit 1)

      - name: Correr los tests
        run: python -m pytest tests/ -v
